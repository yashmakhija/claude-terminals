# claude-terminals tmux config
# Simple navigation — no tmux knowledge needed

# Mouse: click to switch panes, scroll to scroll output
set -g mouse on

# Alt+Arrow to switch panes (no prefix key needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Ctrl+Arrow to resize panes
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

# Status bar — shows project name and navigation hint
set -g status on
set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[bold fg=#89b4fa] #S #[nobold fg=#585b70] │ '
set -g status-left-length 30
set -g status-right '#[fg=#585b70]Alt+arrow navigate  •  click to focus  •  Ctrl+D close'
set -g status-right-length 60

# Active pane border highlight
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-style 'fg=#313244'

# Start pane index at 1
set -g base-index 1
setw -g pane-base-index 1

# No delay on escape
set -sg escape-time 0

# Bigger scrollback
set -g history-limit 50000

# Focus events so Claude Code knows when a pane is active
set -g focus-events on
